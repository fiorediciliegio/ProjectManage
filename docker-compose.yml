services:
  mysql:
    image: mysql:8.4
    container_name: project-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-projectmanage123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-project_management}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: project-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: project-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: project-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.4
    container_name: project-kibana
    restart: unless-stopped
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    container_name: project-backend
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-compose-local-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      DB_ENGINE: django.db.backends.mysql
      DB_NAME: ${MYSQL_DATABASE:-project_management}
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-projectmanage123456}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_WAIT_TIMEOUT: 120
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      CACHE_URL: redis://redis:6379/2
      QDRANT_URL: http://qdrant:6333
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_REQUEST_TIMEOUT: ${ELASTICSEARCH_REQUEST_TIMEOUT:-20}
      ELASTICSEARCH_MAX_RETRIES: ${ELASTICSEARCH_MAX_RETRIES:-2}
      ELASTICSEARCH_BULK_CHUNK_SIZE: ${ELASTICSEARCH_BULK_CHUNK_SIZE:-100}
      ELASTICSEARCH_BULK_REQUEST_TIMEOUT: ${ELASTICSEARCH_BULK_REQUEST_TIMEOUT:-60}
      RAG_KEYWORD_INDEX_REQUIRED: ${RAG_KEYWORD_INDEX_REQUIRED:-False}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-dashscope}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-qwen3.7-text-embedding}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
      EMBEDDING_TIMEOUT: ${EMBEDDING_TIMEOUT:-60}
      EMBEDDING_MAX_RETRIES: ${EMBEDDING_MAX_RETRIES:-2}
      RAG_SEMANTIC_CHUNKING_ENABLED: ${RAG_SEMANTIC_CHUNKING_ENABLED:-True}
      RAG_SEMANTIC_CHUNKING_MIN_BLOCK_CHARS: ${RAG_SEMANTIC_CHUNKING_MIN_BLOCK_CHARS:-80}
      RAG_SEMANTIC_CHUNKING_TARGET_CHARS: ${RAG_SEMANTIC_CHUNKING_TARGET_CHARS:-900}
      RAG_SEMANTIC_CHUNKING_MAX_CHUNK_CHARS: ${RAG_SEMANTIC_CHUNKING_MAX_CHUNK_CHARS:-1400}
      RAG_SEMANTIC_CHUNKING_SIMILARITY_THRESHOLD: ${RAG_SEMANTIC_CHUNKING_SIMILARITY_THRESHOLD:-0.62}
      RAG_SEMANTIC_CHUNKING_SHORT_MERGE_MIN_SIMILARITY: ${RAG_SEMANTIC_CHUNKING_SHORT_MERGE_MIN_SIMILARITY:-0.5}
      RAG_SEMANTIC_CHUNKING_EMBED_TEXT_CHARS: ${RAG_SEMANTIC_CHUNKING_EMBED_TEXT_CHARS:-900}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      RAG_CHAT_BASE_URL: ${RAG_CHAT_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      RAG_CHAT_MODEL: ${RAG_CHAT_MODEL:-qwen3.8-max}
      RAG_RERANK_MODEL: ${RAG_RERANK_MODEL:-qwen3-rerank}
    ports:
      - "8000:8000"
    volumes:
      - backend_media:/app/media
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      elasticsearch:
        condition: service_healthy

  celery_worker:
    build:
      context: ./backend
    container_name: project-celery-worker
    restart: unless-stopped
    command: celery -A Projectmanagement worker -l info -Q default,rag_index,rag_maintenance
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-compose-local-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      DB_ENGINE: django.db.backends.mysql
      DB_NAME: ${MYSQL_DATABASE:-project_management}
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-projectmanage123456}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_WAIT_TIMEOUT: 120
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      CACHE_URL: redis://redis:6379/2
      QDRANT_URL: http://qdrant:6333
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_REQUEST_TIMEOUT: ${ELASTICSEARCH_REQUEST_TIMEOUT:-20}
      ELASTICSEARCH_MAX_RETRIES: ${ELASTICSEARCH_MAX_RETRIES:-2}
      ELASTICSEARCH_BULK_CHUNK_SIZE: ${ELASTICSEARCH_BULK_CHUNK_SIZE:-100}
      ELASTICSEARCH_BULK_REQUEST_TIMEOUT: ${ELASTICSEARCH_BULK_REQUEST_TIMEOUT:-60}
      RAG_KEYWORD_INDEX_REQUIRED: ${RAG_KEYWORD_INDEX_REQUIRED:-False}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-dashscope}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-qwen3.7-text-embedding}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
      EMBEDDING_TIMEOUT: ${EMBEDDING_TIMEOUT:-60}
      EMBEDDING_MAX_RETRIES: ${EMBEDDING_MAX_RETRIES:-2}
      RAG_SEMANTIC_CHUNKING_ENABLED: ${RAG_SEMANTIC_CHUNKING_ENABLED:-True}
      RAG_SEMANTIC_CHUNKING_MIN_BLOCK_CHARS: ${RAG_SEMANTIC_CHUNKING_MIN_BLOCK_CHARS:-80}
      RAG_SEMANTIC_CHUNKING_TARGET_CHARS: ${RAG_SEMANTIC_CHUNKING_TARGET_CHARS:-900}
      RAG_SEMANTIC_CHUNKING_MAX_CHUNK_CHARS: ${RAG_SEMANTIC_CHUNKING_MAX_CHUNK_CHARS:-1400}
      RAG_SEMANTIC_CHUNKING_SIMILARITY_THRESHOLD: ${RAG_SEMANTIC_CHUNKING_SIMILARITY_THRESHOLD:-0.62}
      RAG_SEMANTIC_CHUNKING_SHORT_MERGE_MIN_SIMILARITY: ${RAG_SEMANTIC_CHUNKING_SHORT_MERGE_MIN_SIMILARITY:-0.5}
      RAG_SEMANTIC_CHUNKING_EMBED_TEXT_CHARS: ${RAG_SEMANTIC_CHUNKING_EMBED_TEXT_CHARS:-900}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      RAG_CHAT_BASE_URL: ${RAG_CHAT_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      RAG_CHAT_MODEL: ${RAG_CHAT_MODEL:-qwen3.8-max}
      RAG_RERANK_MODEL: ${RAG_RERANK_MODEL:-qwen3-rerank}
    volumes:
      - backend_media:/app/media
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      elasticsearch:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: project-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  redis_data:
  qdrant_storage:
  elasticsearch_data:
  backend_media:
